name: Daily DB Backup to S3

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Dump and upload to S3
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.APP_AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.APP_AWS_SECRET_KEY }}
          AWS_REGION: ${{ secrets.APP_AWS_REGION }}
          S3_BUCKET: ${{ secrets.APP_S3_BUCKET }}
        run: |
          set -eo pipefail
          FILENAME="medical-tracker-latest.sql.gz"

          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --format=plain \
            | gzip \
            | aws s3 cp - "s3://${S3_BUCKET}/db-backups/${FILENAME}" \
                --storage-class STANDARD_IA

          echo "Backup uploaded: s3://${S3_BUCKET}/db-backups/${FILENAME}"
